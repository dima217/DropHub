version: '3.8'

services:
  app:
    build: .
    ports:
      - "3000:3000"
    restart: always
    volumes:
      - /var/www/uploads:/app/uploads

  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq
    restart: always
    hostname: rabbitmq
    ports:
      - 5672:5672  
      - 15672:15672  
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq  