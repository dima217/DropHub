version: '3.8'

services:
  # Главное приложение (API Gateway)
  main-app:
    build: .
    ports:
      - '3000:3000'
    restart: always
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - MONGO_URL=${MONGO_URL}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
    depends_on:
      - rabbitmq
      - postgres
    volumes:
      - /var/www/uploads:/app/uploads

  # File Service микросервис
  file-service:
    build:
      context: ./services/file-service
      dockerfile: Dockerfile
    ports:
      - '3001:3001'
    restart: always
    environment:
      - RABBITMQ_URL=amqp://rabbitmq:5672
      - MONGO_URL=${MONGO_URL}
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
    depends_on:
      - rabbitmq
      - mongodb

  # PostgreSQL для главного приложения
  postgres:
    image: postgres:15
    container_name: postgres
    restart: always
    environment:
      - POSTGRES_USER=${DB_USERNAME:-postgres}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-postgres}
      - POSTGRES_DB=${DB_DATABASE:-drop_hub}
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MongoDB для File Service
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: always
    ports:
      - '27017:27017'
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=drop_hub_files

  # RabbitMQ для межсервисной коммуникации
  rabbitmq:
    image: rabbitmq:3.9-management
    container_name: rabbitmq
    restart: always
    hostname: rabbitmq
    ports:
      - 5672:5672
      - 15672:15672
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # MinIO для S3-совместимого хранилища
  minio:
    image: minio/minio:latest
    container_name: minio
    restart: always
    ports:
      - '9000:9000'
      - '9001:9001'
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  mongodb_data:
  rabbitmq_data:
  minio_data:
